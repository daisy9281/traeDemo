<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生轨迹</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="navbar">
        <h1>人生轨迹</h1>
        <div class="navbar-actions">
            <button class="btn btn-primary" id="addEventBtn">
                <span>+</span> 添加事件
            </button>
            <button class="btn btn-secondary" id="exportBtn">
                <span>📷</span> 导出截图
            </button>
            <button class="btn btn-secondary" id="exportDataBtn">
                <span>📤</span> 导出数据
            </button>
            <button class="btn btn-secondary" id="importDataBtn">
                <span>📥</span> 导入数据
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="thumbnail-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div class="thumbnail-title">轨迹缩略图（拖动选择范围）</div>
                <button class="btn btn-sm btn-primary" id="selectAllBtn">全选</button>
            </div>
            <div class="thumbnail-canvas" id="thumbnailCanvas">
                <canvas id="thumbnailChart"></canvas>
                <div class="selection-box" id="selectionBox"></div>
            </div>
        </div>

        <div class="main-chart-container">
            <div class="chart-header">
                <div class="chart-title">人生轨迹图</div>
                <div class="chart-controls">
                    <button class="chart-type-btn active" data-type="line">曲线图</button>
                    <button class="chart-type-btn" data-type="bar">条状图</button>
                    <div class="extend-years-control">
                        <label for="extendYears">延长年数:</label>
                        <input type="range" id="extendYears" min="0" max="100" value="1" step="1">
                        <span id="extendYearsValue">1</span>年
                    </div>
                </div>
            </div>
            <div class="chart-canvas" id="mainChartContainer">
                <canvas id="mainChart"></canvas>
                <div class="tooltip" id="tooltip"></div>
                <div class="x-axis-area" id="xAxisArea"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="addEventModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">添加事件</h2>
                <button class="close-btn" id="closeAddModal">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">事件时间 *</label>
                <input type="datetime-local" class="form-input" id="eventDate" required>
            </div>
            <div class="form-group">
                <label class="form-label">事件名称（15字以内）*</label>
                <input type="text" class="form-input" id="eventName" maxlength="15" placeholder="请输入事件名称" required>
            </div>
            <div class="form-group">
                <label class="form-label">事件描述</label>
                <textarea class="form-textarea" id="eventDescription" placeholder="请输入事件描述"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">心情颜色</label>
                <div class="color-picker-container">
                    <input type="color" class="color-input" id="eventColor" value="#3498db">
                    <div class="gradient-toggle">
                        <input type="checkbox" id="useGradient">
                        <label for="useGradient">使用渐变色</label>
                    </div>
                </div>
                <div class="gradient-colors" id="gradientColors">
                    <input type="color" class="color-input" id="eventColor2" value="#9b59b6">
                    <span>到</span>
                    <input type="color" class="color-input" id="eventColor3" value="#e74c3c">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">事件重要程度（-100 到 100）</label>
                <input type="range" class="importance-slider" id="eventImportance" min="-100" max="100" value="50">
                <div class="importance-value" id="importanceValue">50</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelAddEvent">取消</button>
                <button class="btn btn-success" id="confirmAddEvent">完成</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">导出截图</h2>
                <button class="close-btn" id="closeExportModal">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">时间范围</label>
                <div style="display: flex; gap: 10px;">
                    <input type="date" class="form-input" id="exportStartDate">
                    <span>至</span>
                    <input type="date" class="form-input" id="exportEndDate">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">图片样式</label>
                <div class="chart-controls">
                    <button class="chart-type-btn active" data-type="line" id="exportLineBtn">曲线图</button>
                    <button class="chart-type-btn" data-type="bar" id="exportBarBtn">条状图</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelExport">取消</button>
                <button class="btn btn-success" id="confirmExport">导出</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="exportDataModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">导出数据</h2>
                <button class="close-btn" id="closeExportDataModal">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">时间范围</label>
                <div style="display: flex; gap: 10px;">
                    <input type="date" class="form-input" id="exportDataStartDate">
                    <span>至</span>
                    <input type="date" class="form-input" id="exportDataEndDate">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">导出格式</label>
                <select class="form-input" id="exportFormat">
                    <option value="json">JSON</option>
                    <option value="csv">CSV</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelExportData">取消</button>
                <button class="btn btn-success" id="confirmExportData">导出</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="importDataModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">导入数据</h2>
                <button class="close-btn" id="closeImportDataModal">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">选择文件</label>
                <input type="file" class="form-input" id="importDataFile" accept=".json,.csv">
            </div>
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="overwriteData"> 覆盖现有数据
                </label>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelImportData">取消</button>
                <button class="btn btn-success" id="confirmImportData">导入</button>
            </div>
        </div>
    </div>

    <script src="src/js/app.js"></script>
</body>
</html>
